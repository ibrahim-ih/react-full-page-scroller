version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      react-and-types:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - minor
          - patch
      test-tooling:
        patterns:
          - '@testing-library/*'
          - '@types/jest'
          - '@playwright/test'
          - babel-jest
          - jest
          - jest-*
          - playwright
        update-types:
          - minor
          - patch
      lint-tooling:
        patterns:
          - '@typescript-eslint/*'
          - eslint
          - eslint-*
          - prettier
          - prettier-*
          - typescript
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /example
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      react-and-types:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - minor
          - patch
      test-tooling:
        patterns:
          - '@testing-library/*'
          - '@types/jest'
          - '@playwright/test'
          - babel-jest
          - jest
          - jest-*
          - playwright
        update-types:
          - minor
          - patch
      lint-tooling:
        patterns:
          - '@typescript-eslint/*'
          - eslint
          - eslint-*
          - prettier
          - prettier-*
          - typescript
        update-types:
          - minor
          - patch
